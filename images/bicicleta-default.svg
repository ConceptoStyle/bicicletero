<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Fondo Gradiente -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f1218"/>
    </linearGradient>

    <!-- Gradiente Metal Marco -->
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Sombra -->
    <filter id="blurShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="900" fill="url(#bgGrad)"/>
  
  <!-- Piso / Sombra -->
  <ellipse cx="800" cy="780" rx="600" ry="30" fill="#000000" opacity="0.6" filter="url(#blurShadow)"/>

  <g id="bicicleta" transform="translate(0, 0)">
    <!-- Rueda Trasera -->
    <g id="rueda-trasera">
      <circle cx="450" cy="580" r="180" fill="none" stroke="#1a202c" stroke-width="24"/>
      <circle cx="450" cy="580" r="170" fill="none" stroke="#cbd5e0" stroke-width="6"/>
      <!-- Rayos -->
      <path d="M450 400 L450 760 M270 580 L630 580 M323 453 L577 707 M323 707 L577 453" stroke="#a0aec0" stroke-width="1.5" opacity="0.7"/>
      <circle cx="450" cy="580" r="20" fill="#4a5568"/>
      <circle cx="450" cy="580" r="8" fill="#cbd5e0"/>
    </g>

    <!-- Rueda Delantera -->
    <g id="rueda-delantera">
      <circle cx="1150" cy="580" r="180" fill="none" stroke="#1a202c" stroke-width="24"/>
      <circle cx="1150" cy="580" r="170" fill="none" stroke="#cbd5e0" stroke-width="6"/>
      <!-- Rayos -->
      <path d="M1150 400 L1150 760 M970 580 L1330 580 M1023 453 L1277 707 M1023 707 L1277 453" stroke="#a0aec0" stroke-width="1.5" opacity="0.7"/>
      <circle cx="1150" cy="580" r="20" fill="#4a5568"/>
      <circle cx="1150" cy="580" r="8" fill="#cbd5e0"/>
    </g>

    <!-- Cadena y Plato -->
    <path d="M450 580 L700 580" stroke="#718096" stroke-width="8" stroke-dasharray="6,4"/>
    <circle cx="700" cy="580" r="45" fill="none" stroke="#cbd5e0" stroke-width="10"/>
    <circle cx="700" cy="580" r="15" fill="#2d3748"/>

    <!-- Marco / Cuadro -->
    <g id="cuadro" stroke="url(#frameGrad)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Tija Trasera Abajo -->
      <line x1="450" y1="580" x2="700" y2="580" stroke-width="18"/>
      <!-- Tija Trasera Arriba -->
      <line x1="450" y1="580" x2="600" y2="380" stroke-width="18"/>
      <!-- Tubo Asiento -->
      <line x1="700" y1="580" x2="600" y2="380" stroke-width="22"/>
      <!-- Tubo Inferior -->
      <line x1="700" y1="580" x2="1020" y2="360" stroke-width="26"/>
      <!-- Tubo Superior -->
      <line x1="600" y1="380" x2="1000" y2="360" stroke-width="22"/>
      <!-- Tubo Dirección -->
      <line x1="1000" y1="360" x2="1030" y2="340" stroke-width="28"/>
      <!-- Horquilla Delantera -->
      <line x1="1020" y1="360" x2="1150" y2="580" stroke-width="20"/>
    </g>

    <!-- Marca "CONCEPTO STYLE" en el tubo inferior -->
    <g transform="translate(840, 480) rotate(-26)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4" opacity="0.95">CONCEPTO STYLE</text>
    </g>

    <!-- Manubrio -->
    <path d="M1000 340 L980 270 L1040 260" fill="none" stroke="#2d3748" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1030 260 L1070 260" fill="none" stroke="#1a202c" stroke-width="22" stroke-linecap="round"/>

    <!-- Asiento / Sillín -->
    <path d="M570 370 L630 370 C650 370 660 380 650 390 C640 400 580 400 560 390 Z" fill="#1a202c"/>
    <line x1="600" y1="380" x2="600" y2="330" stroke="#718096" stroke-width="16" stroke-linecap="round"/>

    <!-- Pedales -->
    <line x1="700" y1="580" x2="670" y2="640" stroke="#cbd5e0" stroke-width="12" stroke-linecap="round"/>
    <rect x="650" y="635" width="40" height="12" rx="4" fill="#1a202c"/>
  </g>
</svg>
